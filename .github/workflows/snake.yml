name: Generate Contribution Snake

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: raniduNF26
          outputs: |
            dist/github-snake.svg?color_snake=#7046c4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#67e8f9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated SVGs to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init --initial-branch=output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-snake.svg github-snake-dark.svg
          git commit -m 'Refresh contribution snake'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force "https://github.com/${{ github.repository }}.git" HEAD:output
